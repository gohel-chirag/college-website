    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <!-- Header -->
    <header>
        <div class="heading">
            <h1 align="center">Geetanjali College</h1>
            <h3 align="center">Learn • Innovate • Grow</h3>
        </div><hr>
    </header>


    <!-- Navbar -->
    <nav>
        <div class="navigations" align="center">
            <a href="index.html">Home</a> |&nbsp;
            <a href="about.html">About</a> |&nbsp;

        </div>
    </nav><hr>


    <!-- Main content-->
    <main>
        <!-- Admission -->
        <div class="admission" align="center">
            <h2>Admission Form</h2>
            <table>
                <form action="" method="post">
                    <!-- Full Name -->
                    <tr>
                        <td><label for="fullname">Full Name : </label></td>
                        <td><input type="text" name="fullname" id="" placeholder="Enter your fullname"></td>
                    </tr>

                    <!-- DOB -->
                    <tr>
                        <td><label for="dob">Date Of Birth : </label></td>
                        <td><input type="date" name="dob" id=""></td>
                    </tr>

                    <!-- Gender -->
                    <tr>
                        <td><label for="gender">Gender : </label></td>
                        <td><input type="radio" name="gender" id="male" value="male"> <label for="male">Male</label>&nbsp;&nbsp;
                            <input type="radio" name="gender" id="female" value="female"> <label for="female">Female</label>
                        </td>
                    </tr>

                    <!-- Email -->
                    <tr>
                        <td><label for="email">Email : </label></td>
                        <td><input type="email" name="email" id="" placeholder="Enter your email"></td>
                    </tr>

                    <!-- Mobile -->
                    <tr>
                        <td><label for="mobile">Mobile : </label></td>
                        <td><input type="tel" name="mobile" id="" placeholder="Enter your mobile number"></td>
                    </tr>

                    <!-- Address -->
                    <tr>
                        <td><label for="address">Address : </label></td>
                        <td><textarea name="address" id="" placeholder="Enter your address"></textarea></td>
                    </tr>

                    <!-- Course -->
                    <tr>
                        <td><label for="course">Course : </label></td>
                        <td>
                            <select name="course" id="">
                                <option value="BCA">BCA</option>
                                <option value="BBA">BBA</option>
                                <option value="BCOM">BCOM</option>
                                <option value="BSC IT">BSC IT</option>
                                <option value="MSC IT">MSC IT</option>
                            </select>
                        </td>
                    </tr>

                    <!-- 12th Percentage -->
                    <tr>
                        <td><label for="percentage">12<sup>th</sup> Percentage : </label></td>
                        <td><input type="text" name="percentage" id="" placeholder="Enter 12th percentage"></td>
                    </tr>

                    <!-- City -->
                    <tr>
                        <td><label for="city">City : </label></td>
                        <td><input type="text" name="city" id="" placeholder="Enter your city"></td>
                    </tr>

                    <!-- Buttons -->
                    <tr align="center">
                        <td colspan="2"><button type="submit">SUBMIT</button>&nbsp;&nbsp;&nbsp;<button type="reset">RESET</button></td>
                    </tr>
                </form>
            </table>
        </div><hr>
    </main>


    <!-- Footer -->
    <footer>
        <div class="footer" align="center">
            <p align="center">
                <strong>Geetanjali Group Of College</strong><br>
                Learn • Innovate • Grow<br>
                &copy;2026 Geetanjali Group Of College
            </p>
        </div>
    </footer>
</body>
</html>
